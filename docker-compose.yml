services:

  db:
    image: mysql:8.4
    container_name: cropqueue-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: perishable_crop_db
      MYSQL_USER: cropqueue
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - cropqueue-network


  backend:
    image: chandima0925/cropqueue-backend:latest
    container_name: cropqueue-backend

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      PORT: "5000"

      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: cropqueue
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: perishable_crop_db

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h

    networks:
      - cropqueue-network


  frontend:
    image: chandima0925/cropqueue-frontend:latest
    container_name: cropqueue-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8081:80"

    networks:
      - cropqueue-network


networks:
  cropqueue-network:
    driver: bridge


volumes:
  mysql_data:
